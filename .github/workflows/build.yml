name: Build Radio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write app source
        run: |
          rm -rf app && mkdir -p app
          mkdir -p "$(dirname 'app/settings.gradle')"
          cat > 'app/settings.gradle' <<'RADIO_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Radio'
          RADIO_EOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'RADIO_EOF'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'il.joe.radio'
              compileSdk 34
              defaultConfig {
                  applicationId 'il.joe.radio'
                  minSdk 28
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "2.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs {
                  debug {
                      storeFile file('radio.jks')
                      storePassword 'radio1234'
                      keyAlias 'radio'
                      keyPassword 'radio1234'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-session:1.4.1'
              implementation 'androidx.annotation:annotation:1.8.0'
              implementation 'com.google.guava:guava:33.2.1-android'
          }
          RADIO_EOF
          mkdir -p "$(dirname 'app/gradle.properties')"
          cat > 'app/gradle.properties' <<'RADIO_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          RADIO_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'RADIO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application
                  android:label="הרדיו שלי"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MainActivity$PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          RADIO_EOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_bg.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_bg.xml' <<'RADIO_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108">
                          <item android:offset="0" android:color="#FF24375F" />
                          <item android:offset="1" android:color="#FF0A0E16" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="radial" android:centerX="54" android:centerY="46" android:gradientRadius="44">
                          <item android:offset="0" android:color="#553F7DFF" />
                          <item android:offset="1" android:color="#003F7DFF" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          RADIO_EOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_fg.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_fg.xml' <<'RADIO_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M45.57,38.93 A11,11 0 0,0 45.57,53.07" android:strokeColor="#FFF2A03D" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M62.43,38.93 A11,11 0 0,1 62.43,53.07" android:strokeColor="#FF4F8BFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M39.45,33.79 A19,19 0 0,0 39.45,58.21" android:strokeColor="#CCF2A03D" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M68.55,33.79 A19,19 0 0,1 68.55,58.21" android:strokeColor="#CC4F8BFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M33.32,28.64 A27,27 0 0,0 33.32,63.36" android:strokeColor="#80F2A03D" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M74.68,28.64 A27,27 0 0,1 74.68,63.36" android:strokeColor="#804F8BFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M54,50 L44.5,84 M54,50 L63.5,84 M47.6,73 L60.4,73" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" android:strokeLineJoin="round" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,46m-5.5,0a5.5,5.5 0,1 1,11 0a5.5,5.5 0,1 1,-11 0" />
          </vector>
          RADIO_EOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_mono.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_mono.xml' <<'RADIO_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M45.57,38.93 A11,11 0 0,0 45.57,53.07" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M62.43,38.93 A11,11 0 0,1 62.43,53.07" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M39.45,33.79 A19,19 0 0,0 39.45,58.21" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M68.55,33.79 A19,19 0 0,1 68.55,58.21" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M33.32,28.64 A27,27 0 0,0 33.32,63.36" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M74.68,28.64 A27,27 0 0,1 74.68,63.36" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" />
              <path android:pathData="M54,50 L44.5,84 M54,50 L63.5,84 M47.6,73 L60.4,73" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.2" android:strokeLineCap="round" android:strokeLineJoin="round" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,46m-5.5,0a5.5,5.5 0,1 1,11 0a5.5,5.5 0,1 1,-11 0" />
          </vector>
          RADIO_EOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'RADIO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
              <monochrome android:drawable="@drawable/ic_launcher_mono" />
          </adaptive-icon>
          RADIO_EOF
          mkdir -p "$(dirname 'app/src/main/java/il/joe/radio/MainActivity.java')"
          cat > 'app/src/main/java/il/joe/radio/MainActivity.java' <<'RADIO_EOF'
          package il.joe.radio;

          import android.animation.ArgbEvaluator;
          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.PendingIntent;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.animation.LinearInterpolator;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.PopupMenu;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.DefaultLoadControl;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.session.MediaController;
          import androidx.media3.session.MediaSession;
          import androidx.media3.session.MediaSessionService;
          import androidx.media3.session.SessionCommand;
          import androidx.media3.session.SessionResult;
          import androidx.media3.session.SessionToken;

          import com.google.common.util.concurrent.Futures;
          import com.google.common.util.concurrent.ListenableFuture;

          import java.io.ByteArrayOutputStream;

          public class MainActivity extends Activity {

              // ---------- התחנות ----------
              static final String[] IDS = {"galei", "c14"};
              static final String[] NAMES = {"גלי ישראל", "ערוץ 14"};
              static final String[] SUBS = {"94FM · 106.5FM", "אודיו מהשידור החי"};
              static final String[] MARKS = {"גלי", "14"};
              static final String[] DEFAULT_URLS = {
                      "https://cdn.cybercdn.live/Galei_Israel/Live/icecast.audio",
                      "https://n-121-5.il.cdn-redge.media/livehls/oil/ch14/live/ch14/live.livx/playlist.m3u8?bitrate=1928000&audioId=1"
              };
              static final int[] ACCENTS = {0xFFF2A03D, 0xFF3F7DFF};

              // ---------- צבעים ----------
              static final int BG = 0xFF0A0E16;
              static final int TEXT = 0xFFF4F6FA;
              static final int MUTED = 0xFF8D96A8;
              static final int DANGER = 0xFFFF6B6B;
              static final int LIVE_RED = 0xFFE5484D;

              static final String CMD_SLEEP = "il.joe.radio.SLEEP";
              static volatile long sleepAt = 0;

              private SharedPreferences prefs;
              private ListenableFuture<MediaController> controllerFuture;
              private MediaController controller;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private int selected = 0;
              private int bgAccent;

              private GradientDrawable bgDrawable;
              private ArtView artView;
              private PlayButton playBtn;
              private EqView eqView;
              private TextView nameView, subView, statusView, sleepView, liveBadge;
              private final LinearLayout[] chips = new LinearLayout[2];
              private final TextView[] chipSubs = new TextView[2];
              private final Bitmap[] arts = new Bitmap[2];
              private final byte[][] artBytes = new byte[2][];

              private final Runnable tick = new Runnable() {
                  @Override public void run() { refresh(); handler.postDelayed(this, 15000); }
              };

              private final Player.Listener listener = new Player.Listener() {
                  @Override public void onEvents(@NonNull Player player, @NonNull Player.Events events) { refresh(); }
              };

              // ======================================================================
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("radio", MODE_PRIVATE);
                  selected = Math.max(0, Math.min(1, prefs.getInt("selected", 0)));
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 29) getWindow().setNavigationBarContrastEnforced(false);
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);

                  for (int i = 0; i < 2; i++) {
                      arts[i] = makeArt(i, 640);
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      arts[i].compress(Bitmap.CompressFormat.PNG, 100, out);
                      artBytes[i] = out.toByteArray();
                  }
                  setContentView(buildUi());
                  applyStation(false);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  SessionToken token = new SessionToken(this, new ComponentName(this, PlaybackService.class));
                  controllerFuture = new MediaController.Builder(this, token).buildAsync();
                  controllerFuture.addListener(() -> {
                      try {
                          controller = controllerFuture.get();
                          controller.addListener(listener);
                          String cur = currentId();
                          if (cur != null && controller.getPlayWhenReady()) {
                              for (int i = 0; i < 2; i++) if (IDS[i].equals(cur) && i != selected) { selected = i; applyStation(false); }
                          }
                          refresh();
                      } catch (Exception e) {
                          Toast.makeText(this, "לא הצלחתי להפעיל את הנגן", Toast.LENGTH_LONG).show();
                      }
                  }, getMainExecutor());
                  handler.post(tick);
              }

              @Override
              protected void onStop() {
                  handler.removeCallbacks(tick);
                  if (controller != null) controller.removeListener(listener);
                  MediaController.releaseFuture(controllerFuture);
                  controller = null;
                  artView.setPlaying(false);
                  eqView.setPlaying(false);
                  playBtn.setMode(PlayButton.PLAY);
                  super.onStop();
              }

              // ======================================================================
              private int dp(float v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              private TextView text(String s, float sp, int color, String family, int style) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.create(family, style));
                  t.setIncludeFontPadding(false);
                  return t;
              }

              private View space(int h, float weight) {
                  View v = new View(this);
                  v.setLayoutParams(new LinearLayout.LayoutParams(1, h, weight));
                  return v;
              }

              private View buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  bgDrawable = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{BG, BG, BG});
                  root.setBackground(bgDrawable);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER_HORIZONTAL);
                  col.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root.addView(col, new FrameLayout.LayoutParams(-1, -1));
                  root.setOnApplyWindowInsetsListener((v, ins) -> {
                      col.setPadding(dp(20), ins.getSystemWindowInsetTop() + dp(10), dp(20), ins.getSystemWindowInsetBottom() + dp(18));
                      return ins;
                  });

                  // --- כותרת ---
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView appName = text("הרדיו שלי", 17, TEXT, "sans-serif-medium", Typeface.NORMAL);
                  header.addView(appName, new LinearLayout.LayoutParams(0, -2, 1f));

                  liveBadge = text("●  LIVE", 11, Color.WHITE, "sans-serif-medium", Typeface.BOLD);
                  liveBadge.setLetterSpacing(0.12f);
                  liveBadge.setPadding(dp(10), dp(5), dp(10), dp(5));
                  GradientDrawable lb = new GradientDrawable();
                  lb.setCornerRadius(dp(20));
                  lb.setColor(LIVE_RED);
                  liveBadge.setBackground(lb);
                  liveBadge.setAlpha(0f);
                  header.addView(liveBadge);

                  TextView more = text("⋮", 24, TEXT, "sans-serif", Typeface.BOLD);
                  more.setGravity(Gravity.CENTER);
                  more.setContentDescription("עוד אפשרויות");
                  LinearLayout.LayoutParams mlp = new LinearLayout.LayoutParams(dp(44), dp(44));
                  mlp.setMarginStart(dp(6));
                  header.addView(more, mlp);
                  more.setOnClickListener(this::showMenu);
                  col.addView(header, new LinearLayout.LayoutParams(-1, dp(48)));

                  col.addView(space(dp(8), 1f));

                  // --- עטיפת התחנה ---
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int artSize = Math.min((int) (dm.widthPixels * 0.80f), dp(360));
                  artView = new ArtView(this);
                  artView.setLayoutParams(new LinearLayout.LayoutParams(artSize, artSize));
                  artView.setContentDescription("לחיצה ארוכה לעדכון קישור השידור");
                  artView.setOnLongClickListener(v -> { editUrl(selected); return true; });
                  col.addView(artView);

                  col.addView(space(dp(14), 0f));

                  nameView = text("", 30, TEXT, "sans-serif", Typeface.BOLD);
                  nameView.setGravity(Gravity.CENTER);
                  col.addView(nameView);
                  col.addView(space(dp(6), 0f));
                  subView = text("", 15, MUTED, "sans-serif", Typeface.NORMAL);
                  subView.setGravity(Gravity.CENTER);
                  col.addView(subView);
                  col.addView(space(dp(14), 0f));

                  LinearLayout statusRow = new LinearLayout(this);
                  statusRow.setGravity(Gravity.CENTER);
                  eqView = new EqView(this);
                  LinearLayout.LayoutParams elp = new LinearLayout.LayoutParams(dp(22), dp(16));
                  elp.setMarginEnd(dp(8));
                  statusRow.addView(eqView, elp);
                  statusView = text("", 14, MUTED, "sans-serif-medium", Typeface.NORMAL);
                  statusRow.addView(statusView);
                  col.addView(statusRow);

                  sleepView = text("", 13, MUTED, "sans-serif", Typeface.NORMAL);
                  sleepView.setGravity(Gravity.CENTER);
                  sleepView.setPadding(0, dp(8), 0, 0);
                  sleepView.setVisibility(View.GONE);
                  col.addView(sleepView);

                  col.addView(space(dp(8), 1f));

                  // --- כפתורי שליטה ---
                  LinearLayout controls = new LinearLayout(this);
                  controls.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  controls.setGravity(Gravity.CENTER);
                  SkipButton prev = new SkipButton(this, -1);
                  prev.setContentDescription("התחנה הקודמת");
                  prev.setOnClickListener(v -> select((selected + 1) % 2));
                  SkipButton next = new SkipButton(this, 1);
                  next.setContentDescription("התחנה הבאה");
                  next.setOnClickListener(v -> select((selected + 1) % 2));
                  playBtn = new PlayButton(this);
                  playBtn.setContentDescription("הפעל או עצור");
                  playBtn.setOnClickListener(v -> togglePlay());
                  controls.addView(prev, new LinearLayout.LayoutParams(dp(60), dp(60)));
                  LinearLayout.LayoutParams plp = new LinearLayout.LayoutParams(dp(104), dp(104));
                  plp.leftMargin = dp(30);
                  plp.rightMargin = dp(30);
                  controls.addView(playBtn, plp);
                  controls.addView(next, new LinearLayout.LayoutParams(dp(60), dp(60)));
                  col.addView(controls);

                  col.addView(space(dp(26), 0f));

                  // --- בחירת תחנה ---
                  LinearLayout stations = new LinearLayout(this);
                  stations.setOrientation(LinearLayout.HORIZONTAL);
                  for (int i = 0; i < 2; i++) {
                      final int idx = i;
                      LinearLayout chip = new LinearLayout(this);
                      chip.setOrientation(LinearLayout.HORIZONTAL);
                      chip.setGravity(Gravity.CENTER_VERTICAL);
                      chip.setPadding(dp(10), dp(10), dp(12), dp(10));
                      ImageView thumb = new ImageView(this);
                      thumb.setImageBitmap(arts[i]);
                      chip.addView(thumb, new LinearLayout.LayoutParams(dp(44), dp(44)));
                      LinearLayout tx = new LinearLayout(this);
                      tx.setOrientation(LinearLayout.VERTICAL);
                      tx.setPaddingRelative(dp(10), 0, 0, 0);
                      TextView n = text(NAMES[i], 15, TEXT, "sans-serif-medium", Typeface.NORMAL);
                      n.setSingleLine(true);
                      tx.addView(n);
                      TextView s = text(SUBS[i], 12, MUTED, "sans-serif", Typeface.NORMAL);
                      s.setSingleLine(true);
                      s.setPadding(0, dp(4), 0, 0);
                      tx.addView(s);
                      chipSubs[i] = s;
                      chip.addView(tx, new LinearLayout.LayoutParams(0, -2, 1f));
                      chip.setOnClickListener(v -> { if (idx != selected) select(idx); else togglePlay(); });
                      chip.setOnLongClickListener(v -> { editUrl(idx); return true; });
                      LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(0, -2, 1f);
                      if (i == 0) clp.setMarginEnd(dp(10));
                      stations.addView(chip, clp);
                      chips[i] = chip;
                  }
                  col.addView(stations, new LinearLayout.LayoutParams(-1, -2));
                  return root;
              }

              // ======================================================================
              private void applyStation(boolean animate) {
                  int to = ACCENTS[selected];
                  int from = bgAccent == 0 ? to : bgAccent;
                  bgAccent = to;
                  if (animate) {
                      ValueAnimator a = ValueAnimator.ofObject(new ArgbEvaluator(), from, to);
                      a.setDuration(450);
                      a.addUpdateListener(an -> paintBg((int) an.getAnimatedValue()));
                      a.start();
                      artView.setAlpha(0f);
                      artView.setScaleX(0.92f);
                      artView.setScaleY(0.92f);
                      artView.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(380).start();
                  } else {
                      paintBg(to);
                  }
                  artView.set(arts[selected], ACCENTS[selected]);
                  playBtn.setAccent(ACCENTS[selected]);
                  eqView.setAccent(ACCENTS[selected]);
                  nameView.setText(NAMES[selected]);
                  subView.setText(SUBS[selected]);
                  refresh();
              }

              private void paintBg(int accent) {
                  bgDrawable.setColors(new int[]{blend(accent, BG, 0.42f), blend(accent, BG, 0.12f), BG});
              }

              static int blend(int c, int base, float amount) {
                  int r = (int) (Color.red(base) + (Color.red(c) - Color.red(base)) * amount);
                  int g = (int) (Color.green(base) + (Color.green(c) - Color.green(base)) * amount);
                  int b = (int) (Color.blue(base) + (Color.blue(c) - Color.blue(base)) * amount);
                  return Color.rgb(r, g, b);
              }

              private String urlFor(int i) { return prefs.getString("url_" + IDS[i], DEFAULT_URLS[i]); }

              private String currentId() {
                  if (controller == null) return null;
                  MediaItem item = controller.getCurrentMediaItem();
                  return item == null ? null : item.mediaId;
              }

              private boolean isRunning() {
                  return controller != null && controller.getPlayWhenReady()
                          && (controller.getPlaybackState() != Player.STATE_IDLE || controller.getPlayerError() != null)
                          && controller.getPlaybackState() != Player.STATE_ENDED;
              }

              private void select(int i) {
                  boolean wasRunning = isRunning();
                  selected = i;
                  prefs.edit().putInt("selected", i).apply();
                  applyStation(true);
                  if (wasRunning) play(i);
              }

              private void togglePlay() {
                  if (controller == null) { Toast.makeText(this, "הנגן עוד נטען, נסה שוב", Toast.LENGTH_SHORT).show(); return; }
                  if (IDS[selected].equals(currentId()) && isRunning()) { controller.stop(); refresh(); return; }
                  play(selected);
              }

              private void play(int i) {
                  if (controller == null) return;
                  String url = urlFor(i);
                  MediaItem.Builder b = new MediaItem.Builder()
                          .setMediaId(IDS[i])
                          .setUri(url)
                          .setMediaMetadata(new MediaMetadata.Builder()
                                  .setTitle(NAMES[i])
                                  .setArtist("שידור חי")
                                  .setStation(NAMES[i])
                                  .setArtworkData(artBytes[i], MediaMetadata.PICTURE_TYPE_FRONT_COVER)
                                  .build());
                  if (url.toLowerCase().contains(".m3u8")) b.setMimeType(MimeTypes.APPLICATION_M3U8);
                  controller.setMediaItem(b.build());
                  controller.prepare();
                  controller.play();
                  refresh();
              }

              private void refresh() {
                  if (playBtn == null) return;
                  String cur = currentId();
                  boolean onSel = IDS[selected].equals(cur);
                  int state = controller == null ? Player.STATE_IDLE : controller.getPlaybackState();
                  boolean running = onSel && isRunning();
                  boolean error = running && controller.getPlayerError() != null;
                  boolean loading = running && !error && state == Player.STATE_BUFFERING;
                  boolean playing = running && !error && state == Player.STATE_READY;

                  playBtn.setMode(!running ? PlayButton.PLAY : (loading || error) ? PlayButton.LOADING : PlayButton.STOP);
                  artView.setPlaying(playing);
                  eqView.setPlaying(playing);
                  liveBadge.animate().alpha(playing ? 1f : 0f).setDuration(250).start();

                  if (error) { statusView.setText("אין חיבור לשידור · מנסה שוב…"); statusView.setTextColor(DANGER); }
                  else if (loading) { statusView.setText("מתחבר לשידור…"); statusView.setTextColor(MUTED); }
                  else if (playing) { statusView.setText("בשידור חי"); statusView.setTextColor(ACCENTS[selected]); }
                  else { statusView.setText("מוכן להאזנה"); statusView.setTextColor(MUTED); }
                  eqView.setVisibility(playing ? View.VISIBLE : View.GONE);

                  boolean anyRunning = isRunning();
                  for (int i = 0; i < 2; i++) {
                      boolean isSel = i == selected;
                      boolean live = anyRunning && IDS[i].equals(cur);
                      GradientDrawable g = new GradientDrawable();
                      g.setCornerRadius(dp(18));
                      g.setColor(isSel ? 0x1FFFFFFF : 0x0DFFFFFF);
                      g.setStroke(dp(isSel ? 1.5f : 1f), isSel ? ACCENTS[i] : 0x1AFFFFFF);
                      chips[i].setBackground(g);
                      chipSubs[i].setText(live ? "● מנגן עכשיו" : SUBS[i]);
                      chipSubs[i].setTextColor(live ? ACCENTS[i] : MUTED);
                  }

                  long left = sleepAt - System.currentTimeMillis();
                  if (sleepAt > 0 && left > 0) {
                      long min = (left + 59999) / 60000;
                      sleepView.setText("טיימר שינה · ייכבה בעוד " + min + " דק׳");
                      sleepView.setVisibility(View.VISIBLE);
                  } else {
                      sleepView.setVisibility(View.GONE);
                  }
              }

              // ---------- תפריט ----------
              private void showMenu(View anchor) {
                  PopupMenu m = new PopupMenu(this, anchor);
                  m.getMenu().add(0, 1, 0, "טיימר שינה");
                  m.getMenu().add(0, 2, 1, "עדכון קישור – " + NAMES[selected]);
                  m.setOnMenuItemClickListener(item -> {
                      if (item.getItemId() == 1) sleepDialog();
                      else editUrl(selected);
                      return true;
                  });
                  m.show();
              }

              private void sleepDialog() {
                  final String[] labels = {"כבוי", "15 דקות", "30 דקות", "45 דקות", "שעה", "שעתיים"};
                  final int[] mins = {0, 15, 30, 45, 60, 120};
                  new AlertDialog.Builder(this)
                          .setTitle("לכבות את הרדיו אחרי…")
                          .setItems(labels, (d, w) -> {
                              if (controller == null) return;
                              Bundle args = new Bundle();
                              args.putInt("min", mins[w]);
                              controller.sendCustomCommand(new SessionCommand(CMD_SLEEP, Bundle.EMPTY), args);
                              sleepAt = mins[w] == 0 ? 0 : System.currentTimeMillis() + mins[w] * 60000L;
                              Toast.makeText(this, mins[w] == 0 ? "טיימר השינה בוטל" : "הרדיו ייכבה בעוד " + labels[w], Toast.LENGTH_SHORT).show();
                              refresh();
                          })
                          .show();
              }

              private void editUrl(int i) {
                  EditText input = new EditText(this);
                  input.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  input.setText(urlFor(i));
                  input.setSelectAllOnFocus(true);
                  input.setTextDirection(View.TEXT_DIRECTION_LTR);
                  FrameLayout box = new FrameLayout(this);
                  box.setPadding(dp(20), dp(8), dp(20), 0);
                  box.addView(input);
                  new AlertDialog.Builder(this)
                          .setTitle("קישור השידור של " + NAMES[i])
                          .setView(box)
                          .setPositiveButton("שמור", (d, w) -> {
                              String u = input.getText().toString().trim();
                              if (!u.isEmpty()) prefs.edit().putString("url_" + IDS[i], u).apply();
                              Toast.makeText(this, "הקישור נשמר", Toast.LENGTH_SHORT).show();
                          })
                          .setNeutralButton("קישור מקורי", (d, w) -> {
                              prefs.edit().remove("url_" + IDS[i]).apply();
                              Toast.makeText(this, "חזר לקישור המקורי", Toast.LENGTH_SHORT).show();
                          })
                          .setNegativeButton("ביטול", null)
                          .show();
              }

              // ---------- עטיפה: לוגו אם הועלה, אחרת סמל מקורי ----------
              private Bitmap makeArt(int i, int size) {
                  Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(out);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  float r = size / 2f;
                  Bitmap logo = null;
                  int id = getResources().getIdentifier("logo_" + IDS[i], "drawable", getPackageName());
                  if (id != 0) {
                      try { logo = BitmapFactory.decodeResource(getResources(), id); } catch (Exception ignored) { }
                  }
                  if (logo != null) {
                      p.setColor(isBright(logo) ? blend(ACCENTS[i], 0xFF000000, 0.45f) : Color.WHITE);
                      c.drawCircle(r, r, r, p);
                      float boxSize = size * 0.68f;
                      float sc = Math.min(boxSize / logo.getWidth(), boxSize / logo.getHeight());
                      float w = logo.getWidth() * sc, h = logo.getHeight() * sc;
                      Path clip = new Path();
                      clip.addCircle(r, r, r, Path.Direction.CW);
                      c.save();
                      c.clipPath(clip);
                      c.drawBitmap(logo, null, new RectF(r - w / 2, r - h / 2, r + w / 2, r + h / 2), p);
                      c.restore();
                  } else {
                      int a = ACCENTS[i];
                      p.setShader(new LinearGradient(0, 0, size, size, blend(Color.WHITE, a, 0.25f), blend(Color.BLACK, a, 0.35f), Shader.TileMode.CLAMP));
                      c.drawCircle(r, r, r, p);
                      p.setShader(null);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(size * 0.007f);
                      p.setColor(0x30FFFFFF);
                      for (float k = 0.50f; k < 0.97f; k += 0.115f) c.drawCircle(r, r, r * k, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.WHITE);
                      p.setTypeface(Typeface.create("sans-serif-black", Typeface.BOLD));
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTextSize(size * 0.30f);
                      Paint.FontMetrics fm = p.getFontMetrics();
                      c.drawText(MARKS[i], r, r - (fm.ascent + fm.descent) / 2f, p);
                  }
                  return out;
              }

              private static boolean isBright(Bitmap b) {
                  long sum = 0; int n = 0;
                  int sx = Math.max(1, b.getWidth() / 24), sy = Math.max(1, b.getHeight() / 24);
                  for (int y = 0; y < b.getHeight(); y += sy)
                      for (int x = 0; x < b.getWidth(); x += sx) {
                          int px = b.getPixel(x, y);
                          if (Color.alpha(px) < 128) continue;
                          sum += (Color.red(px) * 299 + Color.green(px) * 587 + Color.blue(px) * 114) / 1000;
                          n++;
                      }
                  return n > 0 && sum / n > 215;
              }

              // ======================================================================
              // רכיבים מצוירים
              // ======================================================================
              static class ArtView extends View {
                  private Bitmap bmp;
                  private int accent = 0xFF3F7DFF;
                  private boolean playing;
                  private float phase;
                  private ValueAnimator anim;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  private final RectF dst = new RectF();

                  ArtView(Context c) { super(c); }

                  void set(Bitmap b, int a) { bmp = b; accent = a; invalidate(); }

                  void setPlaying(boolean pl) {
                      if (pl == playing) return;
                      playing = pl;
                      if (pl) {
                          anim = ValueAnimator.ofFloat(0f, 1f);
                          anim.setDuration(2600);
                          anim.setRepeatCount(ValueAnimator.INFINITE);
                          anim.setInterpolator(new LinearInterpolator());
                          anim.addUpdateListener(a -> { phase = (float) a.getAnimatedValue(); invalidate(); });
                          anim.start();
                      } else if (anim != null) {
                          anim.cancel();
                          anim = null;
                      }
                      invalidate();
                  }

                  @Override protected void onDraw(@NonNull Canvas c) {
                      float cx = getWidth() / 2f, cy = getHeight() / 2f;
                      float maxR = Math.min(cx, cy);
                      float r = maxR * 0.74f;

                      p.setStyle(Paint.Style.FILL);
                      p.setShader(new RadialGradient(cx, cy, maxR, (accent & 0x00FFFFFF) | 0x55000000, accent & 0x00FFFFFF, Shader.TileMode.CLAMP));
                      c.drawCircle(cx, cy, maxR, p);
                      p.setShader(null);

                      if (playing) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(maxR * 0.012f);
                          for (int k = 0; k < 3; k++) {
                              float f = (phase + k / 3f) % 1f;
                              p.setColor(accent);
                              p.setAlpha((int) (150 * (1f - f)));
                              c.drawCircle(cx, cy, r + f * (maxR - r), p);
                          }
                          p.setAlpha(255);
                      }

                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0x66000000);
                      c.drawCircle(cx, cy + maxR * 0.03f, r * 1.01f, p);
                      if (bmp != null) {
                          dst.set(cx - r, cy - r, cx + r, cy + r);
                          c.drawBitmap(bmp, null, dst, p);
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(maxR * 0.008f);
                      p.setColor(0x26FFFFFF);
                      c.drawCircle(cx, cy, r, p);
                  }
              }

              static class PlayButton extends View {
                  static final int PLAY = 0, STOP = 1, LOADING = 2;
                  private int mode = -1;
                  private int accent = 0xFF3F7DFF;
                  private float spin;
                  private ValueAnimator spinAnim;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path tri = new Path();
                  private final RectF rf = new RectF();

                  PlayButton(Context c) { super(c); setClickable(true); setFocusable(true); }

                  void setAccent(int a) { accent = a; invalidate(); }

                  void setMode(int m) {
                      if (m == mode) return;
                      mode = m;
                      if (m == LOADING) {
                          if (spinAnim == null) {
                              spinAnim = ValueAnimator.ofFloat(0f, 360f);
                              spinAnim.setDuration(900);
                              spinAnim.setRepeatCount(ValueAnimator.INFINITE);
                              spinAnim.setInterpolator(new LinearInterpolator());
                              spinAnim.addUpdateListener(a -> { spin = (float) a.getAnimatedValue(); invalidate(); });
                              spinAnim.start();
                          }
                      } else if (spinAnim != null) {
                          spinAnim.cancel();
                          spinAnim = null;
                      }
                      invalidate();
                  }

                  @Override public boolean onTouchEvent(MotionEvent e) {
                      if (e.getAction() == MotionEvent.ACTION_DOWN) animate().scaleX(0.92f).scaleY(0.92f).setDuration(90).start();
                      if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL)
                          animate().scaleX(1f).scaleY(1f).setDuration(160).start();
                      return super.onTouchEvent(e);
                  }

                  @Override protected void onDraw(@NonNull Canvas c) {
                      float cx = getWidth() / 2f, cy = getHeight() / 2f;
                      float outer = Math.min(cx, cy);
                      float r = outer * 0.84f;

                      p.setStyle(Paint.Style.FILL);
                      p.setColor((accent & 0x00FFFFFF) | 0x33000000);
                      c.drawCircle(cx, cy, outer, p);
                      p.setShader(new LinearGradient(cx, cy - r, cx, cy + r, blend(Color.WHITE, accent, 0.82f), blend(Color.BLACK, accent, 0.85f), Shader.TileMode.CLAMP));
                      c.drawCircle(cx, cy, r, p);
                      p.setShader(null);

                      p.setColor(Color.WHITE);
                      if (mode == PLAY || mode == -1) {
                          tri.reset();
                          tri.moveTo(cx - r * 0.26f, cy - r * 0.38f);
                          tri.lineTo(cx - r * 0.26f, cy + r * 0.38f);
                          tri.lineTo(cx + r * 0.42f, cy);
                          tri.close();
                          p.setStrokeJoin(Paint.Join.ROUND);
                          p.setStyle(Paint.Style.FILL_AND_STROKE);
                          p.setStrokeWidth(r * 0.08f);
                          c.drawPath(tri, p);
                          p.setStyle(Paint.Style.FILL);
                      } else {
                          float s = r * 0.30f;
                          rf.set(cx - s, cy - s, cx + s, cy + s);
                          c.drawRoundRect(rf, r * 0.07f, r * 0.07f, p);
                      }
                      if (mode == LOADING) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeCap(Paint.Cap.ROUND);
                          p.setStrokeWidth(outer * 0.07f);
                          p.setColor(Color.WHITE);
                          float ar = (outer + r) / 2f;
                          rf.set(cx - ar, cy - ar, cx + ar, cy + ar);
                          c.drawArc(rf, spin, 80, false, p);
                          p.setStyle(Paint.Style.FILL);
                      }
                  }
              }

              static class SkipButton extends View {
                  private final int dir;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path tri = new Path();

                  SkipButton(Context c, int dir) { super(c); this.dir = dir; setClickable(true); setFocusable(true); }

                  @Override public boolean onTouchEvent(MotionEvent e) {
                      if (e.getAction() == MotionEvent.ACTION_DOWN) animate().scaleX(0.88f).scaleY(0.88f).setDuration(90).start();
                      if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL)
                          animate().scaleX(1f).scaleY(1f).setDuration(160).start();
                      return super.onTouchEvent(e);
                  }

                  @Override protected void onDraw(@NonNull Canvas c) {
                      float cx = getWidth() / 2f, cy = getHeight() / 2f;
                      float r = Math.min(cx, cy);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0x1AFFFFFF);
                      c.drawCircle(cx, cy, r, p);
                      p.setColor(TEXT);
                      float s = r * 0.30f;
                      tri.reset();
                      tri.moveTo(cx - dir * s * 0.9f, cy - s);
                      tri.lineTo(cx - dir * s * 0.9f, cy + s);
                      tri.lineTo(cx + dir * s * 0.6f, cy);
                      tri.close();
                      c.drawPath(tri, p);
                      float bx = cx + dir * s * 0.75f;
                      c.drawRoundRect(new RectF(bx - s * 0.13f, cy - s, bx + s * 0.13f, cy + s), s * 0.1f, s * 0.1f, p);
                  }
              }

              static class EqView extends View {
                  private boolean playing;
                  private int accent = 0xFF3F7DFF;
                  private float t;
                  private ValueAnimator anim;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rf = new RectF();

                  EqView(Context c) { super(c); }

                  void setAccent(int a) { accent = a; invalidate(); }

                  void setPlaying(boolean pl) {
                      if (pl == playing) return;
                      playing = pl;
                      if (pl) {
                          anim = ValueAnimator.ofFloat(0f, 1000f);
                          anim.setDuration(1000000);
                          anim.setRepeatCount(ValueAnimator.INFINITE);
                          anim.setInterpolator(new LinearInterpolator());
                          anim.addUpdateListener(a -> { t = (float) a.getAnimatedValue(); invalidate(); });
                          anim.start();
                      } else if (anim != null) { anim.cancel(); anim = null; }
                      invalidate();
                  }

                  @Override protected void onDraw(@NonNull Canvas c) {
                      int bars = 4;
                      float w = getWidth(), h = getHeight();
                      float bw = w / (bars * 1.8f);
                      p.setColor(accent);
                      for (int i = 0; i < bars; i++) {
                          float v = playing ? 0.25f + 0.75f * (float) Math.abs(Math.sin(t * (6.0 + i * 1.7) + i * 1.3)) : 0.2f;
                          float x = i * bw * 1.8f + bw * 0.4f;
                          rf.set(x, h - v * h, x + bw, h);
                          c.drawRoundRect(rf, bw / 2, bw / 2, p);
                      }
                  }
              }

              // ======================================================================
              // שירות הניגון ברקע (התראה, מסך נעילה, אוזניות, חיבור מחדש, טיימר שינה)
              // ======================================================================
              public static class PlaybackService extends MediaSessionService {
                  private MediaSession session;
                  private final Handler h = new Handler(Looper.getMainLooper());
                  private int retries = 0;

                  private final Runnable sleepTask = () -> {
                      sleepAt = 0;
                      if (session != null) session.getPlayer().stop();
                  };

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      DefaultLoadControl load = new DefaultLoadControl.Builder()
                              .setBufferDurationsMs(30_000, 60_000, 2_500, 5_000)
                              .build();
                      ExoPlayer player = new ExoPlayer.Builder(this)
                              .setLoadControl(load)
                              .setAudioAttributes(new AudioAttributes.Builder()
                                      .setUsage(C.USAGE_MEDIA)
                                      .setContentType(C.AUDIO_CONTENT_TYPE_SPEECH)
                                      .build(), true)
                              .setHandleAudioBecomingNoisy(true)
                              .setWakeMode(C.WAKE_MODE_NETWORK)
                              .build();
                      // רק אודיו: לא מורידים את הווידאו של ערוץ 14
                      player.setTrackSelectionParameters(player.getTrackSelectionParameters()
                              .buildUpon()
                              .setTrackTypeDisabled(C.TRACK_TYPE_VIDEO, true)
                              .build());
                      player.addListener(new Player.Listener() {
                          @Override public void onPlayerError(@NonNull PlaybackException error) {
                              if (retries >= 8) return;
                              retries++;
                              final boolean behind = error.errorCode == PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW;
                              h.postDelayed(() -> {
                                  if (player.getPlayerError() != null && player.getMediaItemCount() > 0) {
                                      if (behind) player.seekToDefaultPosition();
                                      player.prepare();
                                      player.play();
                                  }
                              }, behind ? 300 : Math.min(2000L * retries, 10000L));
                          }

                          @Override public void onIsPlayingChanged(boolean isPlaying) { if (isPlaying) retries = 0; }

                          @Override public void onMediaItemTransition(MediaItem mediaItem, int reason) { retries = 0; }
                      });

                      PendingIntent open = PendingIntent.getActivity(this, 0,
                              new Intent(this, MainActivity.class),
                              PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                      session = new MediaSession.Builder(this, player)
                              .setSessionActivity(open)
                              .setCallback(new MediaSession.Callback() {
                                  @NonNull @Override
                                  public MediaSession.ConnectionResult onConnect(@NonNull MediaSession s, @NonNull MediaSession.ControllerInfo controller) {
                                      return new MediaSession.ConnectionResult.AcceptedResultBuilder(s)
                                              .setAvailableSessionCommands(MediaSession.ConnectionResult.DEFAULT_SESSION_COMMANDS
                                                      .buildUpon()
                                                      .add(new SessionCommand(CMD_SLEEP, Bundle.EMPTY))
                                                      .build())
                                              .build();
                                  }

                                  @NonNull @Override
                                  public ListenableFuture<SessionResult> onCustomCommand(@NonNull MediaSession s, @NonNull MediaSession.ControllerInfo controller,
                                                                                         @NonNull SessionCommand command, @NonNull Bundle args) {
                                      if (CMD_SLEEP.equals(command.customAction)) {
                                          int min = args.getInt("min", 0);
                                          h.removeCallbacks(sleepTask);
                                          if (min > 0) {
                                              sleepAt = System.currentTimeMillis() + min * 60000L;
                                              h.postDelayed(sleepTask, min * 60000L);
                                          } else {
                                              sleepAt = 0;
                                          }
                                          return Futures.immediateFuture(new SessionResult(SessionResult.RESULT_SUCCESS));
                                      }
                                      return Futures.immediateFuture(new SessionResult(SessionResult.RESULT_ERROR_NOT_SUPPORTED));
                                  }
                              })
                              .build();
                  }

                  @Override
                  public MediaSession onGetSession(@NonNull MediaSession.ControllerInfo controllerInfo) { return session; }

                  @Override
                  public void onTaskRemoved(Intent rootIntent) {
                      Player p = session.getPlayer();
                      if (!p.getPlayWhenReady() || p.getMediaItemCount() == 0) stopSelf();
                  }

                  @Override
                  public void onDestroy() {
                      h.removeCallbacksAndMessages(null);
                      sleepAt = 0;
                      if (session != null) {
                          session.getPlayer().release();
                          session.release();
                          session = null;
                      }
                      super.onDestroy();
                  }
              }
          }
