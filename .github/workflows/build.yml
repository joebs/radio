      - name: Add station logos (logo_galei / logo_c14)
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          for n in galei c14; do
            f=$(find . -path ./app -prune -o -type f -iname "logo_${n}.*" -print | head -n 1)
            if [ -n "$f" ]; then
              ext=$(echo "${f##*.}" | tr 'A-Z' 'a-z')
              [ "$ext" = "jpeg" ] && ext=jpg
              case "$ext" in
                png|jpg|webp) cp "$f" "app/src/main/res/drawable-nodpi/logo_${n}.${ext}"; echo "Logo found: $f" ;;
                *) echo "Unsupported logo type: $f" ;;
              esac
            else
              echo "No logo for $n - using built-in emblem"
            fi
          done

