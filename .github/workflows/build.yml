        working-directory: app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          cp "$APK" HaRadioSheli.apk
          gh release create "v${{ github.run_number }}" HaRadioSheli.apk \
            --repo "${{ github.repository }}" \
            --title "הרדיו שלי - גרסה ${{ github.run_number }}" \
            --notes "גלי ישראל + ערוץ 14 (אודיו). להורדה: HaRadioSheli.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HaRadioSheli
          path: HaRadioSheli.apk
